{% extends "base_auth.html" %}
{% load core_tags %}
{% block title %}{{ T.password_updated }}{% endblock %}
{% block content %}
<div class="auth-state">
    <span class="auth-state__icon auth-state__icon--success">{% include "partials/icon.html" with name="check" %}</span>
    <span class="eyebrow">{{ T.security }}</span>
    <h2>{{ T.password_updated }}</h2>
    <p>{{ T.password_updated_help }}</p>
    <a href="{% url 'accounts:login' %}" class="btn btn--primary btn--full">{{ T.login }}</a>
</div>
{% endblock %}

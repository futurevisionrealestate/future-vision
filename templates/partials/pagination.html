{% load core_tags %}
{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="pagination__link" href="?{% query_replace page=page_obj.previous_page_number %}">{{ T.previous }}</a>
    {% else %}
        <span class="pagination__link is-disabled">{{ T.previous }}</span>
    {% endif %}
    <span class="pagination__status">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="pagination__link" href="?{% query_replace page=page_obj.next_page_number %}">{{ T.next }}</a>
    {% else %}
        <span class="pagination__link is-disabled">{{ T.next }}</span>
    {% endif %}
</nav>
{% endif %}
